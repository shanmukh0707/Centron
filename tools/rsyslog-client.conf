# Forward this machine's syslog to Sentinel on serverpi.
#
# Install on any other LAN machine (NOT on serverpi itself: lines from the
# engine's own addresses are dropped by the feedback-loop guard):
#
#   sudo cp tools/rsyslog-client.conf /etc/rsyslog.d/10-sentinel-forward.conf
#   sudo systemctl restart rsyslog
#
# Then on serverpi:  ./tools/add-log-source.sh <this machine's LAN IP> <kind>
# so the engine knows which parser family this sender speaks.
#
# The template is the whole point. Debian 13's rsyslog defaults to
# RSYSLOG_ForwardFormat, whose timestamp is RFC 3339
# (2026-09-20T10:00:00.123456+00:00). parsers.py expects the traditional
# "Mon DD HH:MM:SS host proc[pid]: msg" shape and matches nothing else, so a
# forward without this template arrives, is counted as malformed, and never
# becomes an event. RSYSLOG_TraditionalForwardFormat is exactly that shape.
#
# TCP (protocol="tcp") so a line is either delivered or queued, never
# silently lost the way UDP datagrams are when serverpi is rebooting. The
# queue holds up to 10000 lines across an outage and retries forever.
#
# target: serverpi's LAN address (VERIFIED in tools/protected_assets.serverpi.yaml).
# Change it here if serverpi moves; add-log-source.sh prints the line with the
# address it detects at run time.

*.* action(type="omfwd"
           target="192.168.1.8" port="5514" protocol="tcp"
           template="RSYSLOG_TraditionalForwardFormat"
           action.resumeRetryCount="-1"
           queue.type="LinkedList" queue.size="10000" queue.saveOnShutdown="on")
