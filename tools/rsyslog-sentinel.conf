# Sentinel parsers expect BSD syslog format (Mon DD HH:MM:SS host proc: msg).
# Debian 13 defaults to RFC3339, which parsers.py _SYSLOG_RE does not match,
# so without this nothing the engine ingests will ever parse.
#
# Install on every machine that feeds Sentinel:
#   sudo cp tools/rsyslog-sentinel.conf /etc/rsyslog.d/00-sentinel-format.conf
#   sudo systemctl restart rsyslog

$ActionFileDefaultTemplate RSYSLOG_TraditionalFileFormat
